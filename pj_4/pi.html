<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw a Circle and Calculate Pi</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f17;
        --panel: #121a2a;
        --text: #eaf0ff;
        --muted: rgba(234, 240, 255, 0.72);
        --stroke: rgba(234, 240, 255, 0.35);
        --btn: #1c2a44;
        --btnHover: #223454;
        --accent: #6aa8ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: #ffffff;
          --text: #0b0f17;
          --muted: rgba(11, 15, 23, 0.7);
          --stroke: rgba(11, 15, 23, 0.25);
          --btn: #eef2ff;
          --btnHover: #e5ebff;
          --accent: #2563eb;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 800px at 20% 0%, rgba(106, 168, 255, 0.18), transparent 60%),
          radial-gradient(1000px 700px at 100% 40%, rgba(129, 255, 212, 0.12), transparent 55%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        padding: 28px 16px 40px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .panel {
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid color-mix(in srgb, var(--stroke) 65%, transparent);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      button {
        appearance: none;
        border: 1px solid color-mix(in srgb, var(--stroke) 70%, transparent);
        background: var(--btn);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.04s ease, background 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        background: var(--btnHover);
        border-color: color-mix(in srgb, var(--accent) 55%, var(--stroke));
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .readout {
        margin-left: auto;
        display: flex;
        gap: 12px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .readout .label {
        font-size: 12px;
        color: var(--muted);
      }
      .readout .value {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .hint {
        margin: 10px 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }
      .canvasWrap {
        margin-top: 12px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--stroke) 65%, transparent);
        background: color-mix(in srgb, var(--panel) 75%, transparent);
      }
      canvas {
        width: 100%;
        height: 520px;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      .foot {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Draw a Circle and Calculate Pi</h1>

      <div class="panel">
        <div class="controls">
          <button id="calcBtn" disabled>Calculate Pi</button>
          <button id="clearBtn">Clear Canvas</button>
          <button id="autoCircleBtn">Draw Perfect Circle</button>

          <div class="readout">
            <div>
              <div class="label">Estimated π</div>
              <div class="value mono" id="piOut">—</div>
            </div>
            <div>
              <div class="label">Points</div>
              <div class="value mono" id="ptsOut">0</div>
            </div>
          </div>
        </div>

        <div class="canvasWrap">
          <canvas id="c"></canvas>
        </div>

        <div class="hint">
          Draw one continuous circle stroke. “Calculate Pi” estimates circumference from your path length and radius from a best-fit circle.
        </div>
        <div class="foot">
          Tip: A smoother circle (and a single clean loop) improves the estimate.
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: false });
      const calcBtn = document.getElementById("calcBtn");
      const clearBtn = document.getElementById("clearBtn");
      const autoCircleBtn = document.getElementById("autoCircleBtn");
      const piOut = document.getElementById("piOut");
      const ptsOut = document.getElementById("ptsOut");

      const state = {
        drawing: false,
        points: [],
        autoDrawing: false,
      };

      function resizeCanvas() {
        const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function clearCanvas() {
        state.points = [];
        state.drawing = false;
        piOut.textContent = "—";
        ptsOut.textContent = "0";
        calcBtn.disabled = true;
        redraw();
      }

      function redraw() {
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim() || "#121a2a";
        ctx.fillRect(0, 0, w, h);

        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#6aa8ff";

        const pts = state.points;
        if (pts.length < 2) return;

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }

      function getLocalPos(evt) {
        const rect = canvas.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      // Kåsa circle fit (algebraic least squares): fits x^2 + y^2 + Ax + By + C = 0
      // Returns {cx, cy, r} or null when degenerate.
      function fitCircleKasa(pts) {
        let sumX = 0,
          sumY = 0,
          sumX2 = 0,
          sumY2 = 0,
          sumXY = 0,
          sumX3 = 0,
          sumY3 = 0,
          sumX2Y = 0,
          sumXY2 = 0;

        const n = pts.length;
        for (const p of pts) {
          const x = p.x;
          const y = p.y;
          const x2 = x * x;
          const y2 = y * y;
          sumX += x;
          sumY += y;
          sumX2 += x2;
          sumY2 += y2;
          sumXY += x * y;
          sumX3 += x2 * x;
          sumY3 += y2 * y;
          sumX2Y += x2 * y;
          sumXY2 += x * y2;
        }

        // Solve linear system:
        // [sumX2 sumXY sumX] [A] = -[sumX3 + sumXY2]
        // [sumXY sumY2 sumY] [B]   -[sumX2Y + sumY3]
        // [sumX  sumY  n   ] [C]   -[sumX2 + sumY2]
        const M = [
          [sumX2, sumXY, sumX],
          [sumXY, sumY2, sumY],
          [sumX, sumY, n],
        ];
        const v = [-(sumX3 + sumXY2), -(sumX2Y + sumY3), -(sumX2 + sumY2)];

        const sol = solve3x3(M, v);
        if (!sol) return null;
        const [A, B, C] = sol;

        const cx = -A / 2;
        const cy = -B / 2;
        const r2 = cx * cx + cy * cy - C;
        if (!Number.isFinite(r2) || r2 <= 0) return null;
        return { cx, cy, r: Math.sqrt(r2) };
      }

      function solve3x3(M, v) {
        // Gaussian elimination with partial pivoting
        const a = [
          [M[0][0], M[0][1], M[0][2], v[0]],
          [M[1][0], M[1][1], M[1][2], v[1]],
          [M[2][0], M[2][1], M[2][2], v[2]],
        ];

        for (let col = 0; col < 3; col++) {
          // pivot
          let pivotRow = col;
          let pivotVal = Math.abs(a[col][col]);
          for (let r = col + 1; r < 3; r++) {
            const val = Math.abs(a[r][col]);
            if (val > pivotVal) {
              pivotVal = val;
              pivotRow = r;
            }
          }
          if (pivotVal < 1e-12) return null;
          if (pivotRow !== col) {
            const tmp = a[col];
            a[col] = a[pivotRow];
            a[pivotRow] = tmp;
          }

          // normalize
          const div = a[col][col];
          for (let c = col; c < 4; c++) a[col][c] /= div;

          // eliminate
          for (let r = 0; r < 3; r++) {
            if (r === col) continue;
            const factor = a[r][col];
            for (let c = col; c < 4; c++) a[r][c] -= factor * a[col][c];
          }
        }

        return [a[0][3], a[1][3], a[2][3]];
      }

      function estimatePiFromStroke(pts) {
        if (pts.length < 10) return null;

        // Circumference estimate from polyline length
        let L = 0;
        for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]);

        // Fit circle to get radius estimate
        const fit = fitCircleKasa(pts);
        if (!fit) return null;
        const r = fit.r;
        if (!Number.isFinite(L) || !Number.isFinite(r) || r <= 0) return null;

        return { pi: L / (2 * r), L, r, cx: fit.cx, cy: fit.cy };
      }

      function sampleReduce(points, maxPts) {
        if (points.length <= maxPts) return points;
        const out = [];
        const step = points.length / maxPts;
        for (let i = 0; i < maxPts; i++) out.push(points[Math.floor(i * step)]);
        return out;
      }

      // Pointer events
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        state.drawing = true;
        state.points = [];
        piOut.textContent = "—";
        const p = getLocalPos(e);
        state.points.push(p);
        ptsOut.textContent = String(state.points.length);
        calcBtn.disabled = true;
        redraw();
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!state.drawing) return;
        const p = getLocalPos(e);
        const last = state.points[state.points.length - 1];
        if (!last || dist(p, last) >= 1.5) {
          state.points.push(p);
          ptsOut.textContent = String(state.points.length);
          if (state.points.length >= 20) calcBtn.disabled = false;
          redraw();
        }
      });

      function endStroke() {
        state.drawing = false;
        if (state.points.length >= 20) calcBtn.disabled = false;
      }
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", endStroke);
      canvas.addEventListener("pointerleave", () => {
        if (state.drawing) endStroke();
      });

      calcBtn.addEventListener("click", () => {
        // Reduce point count for stability / speed while preserving shape
        const pts = sampleReduce(state.points, 800);
        const res = estimatePiFromStroke(pts);
        if (!res) {
          piOut.textContent = "—";
          return;
        }
        piOut.textContent = res.pi.toFixed(6);
      });

      clearBtn.addEventListener("click", clearCanvas);

      // Automated perfect circle drawing
      function drawPerfectCircle() {
        if (state.autoDrawing) return;
        
        clearCanvas();
        state.autoDrawing = true;
        autoCircleBtn.disabled = true;
        calcBtn.disabled = true;
        piOut.textContent = "—";
        
        const rect = canvas.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        // Use about 40% of the smaller dimension as radius for a nice circle
        const radius = Math.min(rect.width, rect.height) * 0.2;
        
        // Generate points along a perfect circle (one full rotation)
        const numPoints = 200; // Enough points for smooth circle
        const circlePoints = [];
        for (let i = 0; i <= numPoints; i++) {
          const angle = (i / numPoints) * 2 * Math.PI;
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);
          circlePoints.push({ x, y });
        }
        
        // Animate drawing by adding points progressively
        state.points = [];
        state.drawing = true;
        let pointIndex = 0;
        
        function addNextPoint() {
          if (pointIndex >= circlePoints.length) {
            state.drawing = false;
            state.autoDrawing = false;
            autoCircleBtn.disabled = false;
            if (state.points.length >= 20) calcBtn.disabled = false;
            return;
          }
          
          state.points.push(circlePoints[pointIndex]);
          ptsOut.textContent = String(state.points.length);
          if (state.points.length >= 20) calcBtn.disabled = false;
          redraw();
          pointIndex++;
          
          // Small delay to simulate drawing speed (adjust for faster/slower)
          setTimeout(addNextPoint, 8);
        }
        
        addNextPoint();
      }

      autoCircleBtn.addEventListener("click", drawPerfectCircle);

      // Init
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      clearCanvas();
    </script>
  </body>
</html>
