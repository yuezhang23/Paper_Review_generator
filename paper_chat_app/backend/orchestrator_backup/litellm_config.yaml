# LiteLLM Proxy config — use with: litellm --config litellm_config.yaml
# OpenAI, Gemini, DeepSeek, xAI (set OPENAI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, XAI_API_KEY in .env).
# Proxy exposes one OpenAI-compatible API.
#
# UI login (http://localhost:4000/ui) requires master_key + PostgreSQL.
# LiteLLM uses PostgreSQL only (not MongoDB). Start Postgres first:
#   docker compose -f docker-compose.litellm-db.yml up -d
#   export DATABASE_URL="postgresql://litellm:litellm@127.0.0.1:5432/litellm"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # change this; required for /ui login
  database_url: os.environ/DATABASE_URL  # required for UI login; use Postgres (see docker-compose.litellm-db.yml)

model_list:
  # xAI (XAI_API_KEY) — default for chat completion
  - model_name: grok-4-fast
    litellm_params:
      model: xai/grok-4-fast
      api_key: os.environ/XAI_API_KEY

  # OpenAI (OPENAI_API_KEY)
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai/gpt-image-1.5
    litellm_params:
      model: openai/gpt-image-1.5
      api_key: os.environ/OPENAI_API_KEY

  # Gemini (GEMINI_API_KEY)
  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini/gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # DeepSeek (DEEPSEEK_API_KEY)
  - model_name: deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: deepseek/deepseek-coder
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY
