# LiteLLM Proxy config — use with: litellm --config litellm_config.yaml
# Set OPENAI_API_KEY (and others as needed); proxy exposes one OpenAI-compatible API.
# Our gateway (mcp_gateway_config.yaml) then points provider 2 at this proxy via LITELLM_PROXY_BASE_URL.
#
# UI login (http://localhost:4000/ui) requires master_key + PostgreSQL.
# LiteLLM uses PostgreSQL only (not MongoDB). Start Postgres first:
#   docker compose -f docker-compose.litellm-db.yml up -d
#   export DATABASE_URL="postgresql://litellm:litellm@127.0.0.1:5432/litellm"
# Default admin login: username admin, password = master_key (or set UI_USERNAME/UI_PASSWORD).

general_settings:
  master_key: Chinadoll  # change this; required for /ui login
  database_url: os.environ/DATABASE_URL  # required for UI login; use Postgres (see docker-compose.litellm-db.yml)

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai/gpt-image-1.5
    litellm_params:
      model: openai/gpt-image-1.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini/gemini-3.0-flash-preview
    litellm_params:
      model: gemini/gemini-3.0-flash-preview
      api_key: os.environ/GEMINI_API_KEY