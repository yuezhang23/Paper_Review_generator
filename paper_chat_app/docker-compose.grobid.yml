services:
  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: grobid
    ports:
      - "${GROBID_PORT:-8070}:8070"
    environment:
      # Increased heap memory and added GC tuning to prevent SIGSEGV crashes
      # -Xmx6g: 6GB max heap (increased from 4GB)
      # -Xms2g: 2GB initial heap (prevents heap resizing overhead)
      # -XX:+UseG1GC: Explicitly use G1GC (already default in Java 17)
      # -XX:MaxGCPauseMillis=200: Target GC pause time
      # -XX:+ExitOnOutOfMemoryError: Fail fast instead of corrupting memory
      # -XX:+HeapDumpOnOutOfMemoryError: Generate heap dump for debugging
      - JAVA_OPTS=-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/grobid/heap_dumps
    volumes:
      - grobid_data:/opt/grobid/data
    restart: unless-stopped
    # Add memory limits to prevent Docker from overcommitting
    mem_limit: 8g
    mem_reservation: 4g
    # Add memory swap limit to prevent excessive swapping
    memswap_limit: 8g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  grobid_data:
